[workspace]
members = ["crates/logoxide", "crates/lx", "crates/logoxide-lsp"]
# The bindings build against a topos checkout (BoltFFI only exports path dependencies' items), so
# they are a workspace of their own and the rest builds from crates.io alone
exclude = ["crates/logoxide-ffi"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# sword-modules, ignore, and globset need 1.88 (CI checks it: the msrv job)
rust-version = "1.88"
license = "CC0-1.0"
repository = "https://github.com/Logoxide/logoxide"
homepage = "https://github.com/Logoxide/logoxide"

[workspace.dependencies]
logoxide = { path = "crates/logoxide", version = "0.1.0" }
# Verse references and Bible markup
topos-bible = "0.6.0"
topos-bible-markup = { version = "0.6.0", features = ["serde"] }
topos-bible-index = { version = "0.6.0", default-features = false, features = ["files"] }
# Finding the references in a book's EPUBs (its pure-Rust reader builds for WebAssembly too)
topos-bible-formats = { version = "0.6.0", default-features = false, features = ["epub"] }
# SWORD modules (read from memory, so WebAssembly too)
sword-modules = { version = "0.1.0", default-features = false, features = ["zip", "bzip2", "xz"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
