[workspace]
members = [
    "crates/logoxide",
    "crates/logoxide-markup",
    "crates/lx",
    "crates/logoxide-lsp",
    "crates/logoxide-text",
    "crates/logoxide-import",
    "crates/logoxide-app",
    "crates/logoxide-mcp",
    "crates/logoxide-quotes",
]
# The bindings build against a topos checkout (BoltFFI only exports path dependencies' items), so
# they are a workspace of their own and the rest builds from crates.io alone
exclude = ["crates/logoxide-ffi"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
# std::fs::File::lock needs 1.89 (CI checks it: the msrv job)
rust-version = "1.89"
license = "CC0-1.0"
repository = "https://github.com/Logoxide/logoxide"
homepage = "https://github.com/Logoxide/logoxide"

[workspace.dependencies]
logoxide = { path = "crates/logoxide", version = "0.1.1" }
# Verse references
topos-bible = "0.6.1"
# Bible markup (OSIS, ThML, GBF, TEI, USX) into one tree: logoxide's own clean-room crate, moved
# from topos; its HTML is a feature nothing here needs yet
logoxide-markup = { path = "crates/logoxide-markup", version = "0.1.1", default-features = false, features = ["serde"] }
logoxide-text = { path = "crates/logoxide-text", version = "0.1.1" }
logoxide-import = { path = "crates/logoxide-import", version = "0.1.1" }
logoxide-app = { path = "crates/logoxide-app", version = "0.1.1" }
topos-bible-index = { version = "0.6.1", default-features = false, features = ["files"] }
# Finding the references in a book's EPUBs (its pure-Rust reader builds for WebAssembly too)
topos-bible-formats = { version = "0.6.1", default-features = false, features = ["epub"] }
# SWORD's versification systems (logoxide-text); its modules, read from memory so WebAssembly
# too, are logoxide-import's (which turns on the compression features)
sword-modules = { version = "0.1.0", default-features = false }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
