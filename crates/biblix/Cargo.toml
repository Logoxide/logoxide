[package]
name = "biblix"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Bibles, commentaries, lexicons, books, and media as versioned packages: read from USX, USFM, and more, cached, and shared"
publish = false

[dependencies]
topos-bible.workspace = true
topos-bible-markup.workspace = true
topos-bible-formats.workspace = true
sword-modules.workspace = true
serde.workspace = true
toml = { version = "0.9", features = ["preserve_order"] }
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
postcard = { version = "1", features = ["use-std"] }
thiserror = "2"
usfm3 = "0.2"
toml_edit = "0.23"
indexmap = { version = "2", features = ["serde"] }
serde_json.workspace = true
# Reading repository archives the host downloads (pure Rust, so WebAssembly too)
flate2 = "1"
tar = { version = "0.4", default-features = false }
# Reading downloads publishers serve as .zip (eBible.org)
zip = { version = "2", default-features = false, features = ["deflate"] }
# Reading an EPUB's metadata (bx new)
quick-xml = "0.42"
