[package]
name = "logoxide-markup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Bible markup (OSIS, ThML, GBF, TEI, USX) as one tree: plain text, HTML with classes, Typst, filters, and search"
readme = "README.md"
keywords = ["bible", "osis", "usx", "thml", "sword"]
categories = ["parser-implementations", "text-processing"]

[dependencies]
topos-bible.workspace = true
quick-xml = "0.42"
serde = { workspace = true, optional = true }

[features]
default = ["html"]
## HtmlRenderer and HtmlOptions: the tree as HTML with prefixed classes, for the front ends that
## show it
html = []
## TypstRenderer and TypstOptions: the tree as Typst markup, each element a call of a function a
## template defines, for typesetting (it writes text: compiling it is the caller's)
typst = []
## Serialize and Deserialize for the tree (Node, Element, Kind, Milestone, NodePath, VerseSpan),
## for caching parsed books
serde = ["dep:serde"]

[dev-dependencies]
# For tests/serde.rs only
serde_json.workspace = true
