[package]
# `lx` on crates.io is taken: the package is logoxide-cli, the binary lx
name = "logoxide-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "lx, logoxide's command line: Bibles, commentaries, lexicons, books, and media as versioned packages"
homepage.workspace = true
readme = "../../README.md"
keywords = ["bible", "package-manager", "cli", "usx", "sword"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "lx"
path = "src/main.rs"

[dependencies]
logoxide.workspace = true
topos-bible.workspace = true
clap = { version = "4", features = ["derive"] }
semver = "1"
toml_edit = "0.23"
# Catalogs and imports over HTTPS (packages themselves come through git)
ureq = "3"
serde_json.workspace = true
serde.workspace = true
# Hashing media as it downloads (lx media check)
sha2 = "0.10"
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }

[dev-dependencies]
assert_cmd = "2"
serde_json.workspace = true
