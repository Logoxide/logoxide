[package]
name = "logoxide-ffi"
# The workspace's version (a workspace of its own, so it can't inherit it): scripts/check-versions.sh
version = "0.1.0"
edition = "2024"
license = "CC0-1.0"
repository = "https://github.com/Logoxide/logoxide"
description = "Bindings for TypeScript/WASM, Python, Swift, and Kotlin (via BoltFFI): logoxide's packages with topos's API"
publish = false

[lib]
# Matches the published package name (logoxide), which BoltFFI uses for artifacts
name = "logoxide"
crate-type = ["staticlib", "cdylib"]

[dependencies]
# Named logoxide_core here: this crate's own library is logoxide (the package name BoltFFI uses)
logoxide_core = { package = "logoxide", path = "../logoxide" }
boltffi = "0.31.0"
semver = "1"
# Bible text: LogoxideBook's tree, as HTML or plain text
logoxide-markup = { path = "../logoxide-markup", features = ["html"] }
# What's in the text: verses, timings, versification maps (the core reads through it too)
logoxide-text = { path = "../logoxide-text" }
# Other publishers' catalogs and downloads as packages (eBible.org, fetch.bible, CCEL, SWORD):
# the import methods, and reading publishers' lists as catalogs
logoxide-import = { path = "../logoxide-import" }
# topos's whole API, re-exported (its library is named topos_bible, like its packages). BoltFFI only
# exports the items of path dependencies, so this needs a topos checkout beside logoxide
# (CI checks out the tag matching topos-bible's version). Without its `markup` feature: books are
# logoxide's (`LogoxideBook`, with the names `BookVerse` and `BookTextOptions` that ToposBook had)
topos-ffi = { path = "../../../topos/crates/topos-ffi", default-features = false }

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = { version = "0.4", default-features = false }
sword-modules = { version = "0.1.0", default-features = false, features = ["zip", "bzip2", "xz"] }

[features]
# Indexing PDFs (`Topos.indexPdf`; builds MuPDF, so native only: Python, not WebAssembly)
pdf = ["topos-ffi/pdf"]

# Its own workspace (the main one builds from crates.io alone). The core and topos-ffi must share
# one topos-bible, so topos's crates come from the same checkout as topos-ffi
[workspace]

[patch.crates-io]
topos-bible = { path = "../../../topos/crates/topos-lib" }
topos-bible-index = { path = "../../../topos/crates/topos-index" }
topos-bible-formats = { path = "../../../topos/crates/topos-formats" }
