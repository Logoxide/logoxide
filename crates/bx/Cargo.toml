[package]
name = "bx"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "biblix's command line: Bibles, commentaries, lexicons, books, and media as versioned packages"
publish = false

[dependencies]
biblix = { path = "../biblix" }
topos-bible.workspace = true
clap = { version = "4", features = ["derive"] }
semver = "1"
toml_edit = "0.23"
# Catalogs and imports over HTTPS (packages themselves come through git)
ureq = "3"
serde_json.workspace = true
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
