name: Release

# Pushing a `v*` tag (matching the workspace's and logoxide-ffi's version) tests and builds
# everything and publishes logoxide to PyPI and npm. Running it from the Actions tab only tests and
# builds, so the packages can be checked first. The crates go to crates.io by hand:
# `cargo publish --workspace`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  BOLTFFI_VERSION: 0.31.0
  CARGO_TERM_COLOR: always
  # The topos tag the bindings build against (BoltFFI only exports path dependencies' items, so
  # logoxide-ffi needs a checkout of topos beside logoxide) is topos-bible's version in
  # Cargo.toml, read by scripts/topos-ref.sh in each job, so it's written in one place. Until
  # sword-modules is on crates.io, the SWORD_MODULES_REPO repository variable names a git URL to
  # build it from (scripts/patch-unpublished.sh).
  SWORD_MODULES_REPO: ${{ vars.SWORD_MODULES_REPO }}

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The workspace's version, its logoxide dependency's, logoxide-ffi's, and the tag's (when
      # this runs for one) must be the same
      - name: The versions and the tag agree
        run: scripts/check-versions.sh ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

  # Nothing is built for publishing until the workspace's and the bindings' tests pass
  test:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: logoxide
      - name: The topos tag to build against
        run: echo "TOPOS_REF=$(logoxide/scripts/topos-ref.sh)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          repository: MasterTemple/topos-bible
          ref: ${{ env.TOPOS_REF }}
          path: topos
      - uses: dtolnay/rust-toolchain@stable
      - name: The workspace's tests
        working-directory: logoxide
        run: |
          scripts/patch-unpublished.sh . topos sword-modules
          cargo test --workspace
      # The bindings patch topos in their own Cargo.toml, so only sword-modules is patched here
      - name: The bindings' tests
        working-directory: logoxide
        run: |
          rm -rf .cargo
          scripts/patch-unpublished.sh . sword-modules
          cd crates/logoxide-ffi && cargo test

  # manylinux containers make wheels that run on any Linux with glibc 2.28 or later
  wheels-linux:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    container: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: logoxide
      - name: The topos tag to build against
        run: echo "TOPOS_REF=$(logoxide/scripts/topos-ref.sh)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          repository: MasterTemple/topos-bible
          ref: ${{ env.TOPOS_REF }}
          path: topos
      - name: Install Rust and BoltFFI
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo" install boltffi_cli --version "$BOLTFFI_VERSION" --locked
      - name: Patch in unpublished dependencies
        run: logoxide/scripts/patch-unpublished.sh logoxide sword-modules
      - name: Build wheels for Python 3.10 to 3.14
        working-directory: logoxide/crates/logoxide-ffi
        run: |
          args=()
          for version in 310 311 312 313 314; do
            args+=(--python "/opt/python/cp${version}-cp${version}/bin/python")
          done
          scripts/pack-python.sh "${args[@]}"
          auditwheel repair dist/python/wheelhouse/*.whl -w wheelhouse
      # Installed from the repaired wheel, outside the source tree, as a user would
      - name: Install a wheel in a fresh environment and use it
        run: |
          wheelhouse="$GITHUB_WORKSPACE/logoxide/crates/logoxide-ffi/wheelhouse"
          /opt/python/cp312-cp312/bin/python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --no-index --find-links "$wheelhouse" logoxide
          cd /tmp && /tmp/smoke/bin/python "$GITHUB_WORKSPACE/logoxide/crates/logoxide-ffi/scripts/smoke-test.py"
          for wheel in "$wheelhouse"/*.whl; do
            unzip -l "$wheel" | grep -q THIRD-PARTY-NOTICES || { echo "$wheel has no THIRD-PARTY-NOTICES"; exit 1; }
          done
      - uses: actions/upload-artifact@v5
        with:
          name: wheels-linux-${{ matrix.arch }}
          path: logoxide/crates/logoxide-ffi/wheelhouse/*.whl

  wheels-other:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      # The oldest macOS the wheels support
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      # Runner Pythons are universal2, but the Rust library is built for one architecture, so
      # tag (and compile) each macOS wheel for the runner's architecture only
      _PYTHON_HOST_PLATFORM: ${{ matrix.os == 'macos-latest' && 'macosx-11.0-arm64' || matrix.os == 'macos-15-intel' && 'macosx-11.0-x86_64' || '' }}
      ARCHFLAGS: ${{ matrix.os == 'macos-latest' && '-arch arm64' || matrix.os == 'macos-15-intel' && '-arch x86_64' || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: logoxide
      - name: The topos tag to build against
        shell: bash
        run: echo "TOPOS_REF=$(logoxide/scripts/topos-ref.sh)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          repository: MasterTemple/topos-bible
          ref: ${{ env.TOPOS_REF }}
          path: topos
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/boltffi*
          key: boltffi-${{ env.BOLTFFI_VERSION }}-${{ matrix.os }}
      - name: Install BoltFFI
        shell: bash
        run: command -v boltffi || cargo install boltffi_cli --version "$BOLTFFI_VERSION" --locked
      - name: Patch in unpublished dependencies
        shell: bash
        run: logoxide/scripts/patch-unpublished.sh logoxide sword-modules
      - name: Build the wheel
        shell: bash
        working-directory: logoxide/crates/logoxide-ffi
        run: scripts/pack-python.sh --python python
      - name: Check the wheel's platform tag
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ls logoxide/crates/logoxide-ffi/dist/python/wheelhouse
          ls logoxide/crates/logoxide-ffi/dist/python/wheelhouse | grep -q "macosx_11_0_$(uname -m)\.whl$"
      # Installed outside the source tree, as a user would
      - name: Install the wheel in a fresh environment and use it
        shell: bash
        run: |
          wheelhouse="$GITHUB_WORKSPACE/logoxide/crates/logoxide-ffi/dist/python/wheelhouse"
          python -m venv "$RUNNER_TEMP/smoke"
          bin="$RUNNER_TEMP/smoke/bin"
          [[ -d "$bin" ]] || bin="$RUNNER_TEMP/smoke/Scripts"
          "$bin/python" -m pip install --no-index --find-links "$wheelhouse" logoxide
          cd "$RUNNER_TEMP" && "$bin/python" "$GITHUB_WORKSPACE/logoxide/crates/logoxide-ffi/scripts/smoke-test.py"
          "$bin/python" -c "import glob, sys, zipfile; sys.exit(not all(any(n.endswith('THIRD-PARTY-NOTICES') for n in zipfile.ZipFile(w).namelist()) for w in glob.glob(sys.argv[1] + '/*.whl')))" "$wheelhouse"
      - uses: actions/upload-artifact@v5
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python }}
          path: logoxide/crates/logoxide-ffi/dist/python/wheelhouse/*.whl

  npm-package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: logoxide
      - name: The topos tag to build against
        run: echo "TOPOS_REF=$(logoxide/scripts/topos-ref.sh)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          repository: MasterTemple/topos-bible
          ref: ${{ env.TOPOS_REF }}
          path: topos
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/boltffi*
          key: boltffi-${{ env.BOLTFFI_VERSION }}-ubuntu
      # wasm-opt comes from the binaryen npm package (Ubuntu's is too old)
      - name: Install BoltFFI
        run: command -v boltffi || cargo install boltffi_cli --version "$BOLTFFI_VERSION" --locked
      - name: Patch in unpublished dependencies
        run: logoxide/scripts/patch-unpublished.sh logoxide sword-modules
      - name: Build the package and run the example against it
        working-directory: logoxide/crates/logoxide-ffi
        run: |
          npm install
          npm run pack:wasm
          # The notices are in what npm would publish
          (cd dist/wasm/pkg && npm pack --dry-run 2>&1 | grep -q THIRD-PARTY-NOTICES)
          cd examples/node && npm install && npm start
      - uses: actions/upload-artifact@v5
        with:
          name: npm-package
          path: logoxide/crates/logoxide-ffi/dist/wasm/pkg

  # Both publish with trusted publishing (OpenID Connect), so no tokens are stored
  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [wheels-linux, wheels-other]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/')
    needs: npm-package
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      # No registry-url: it writes a placeholder token, which npm would send instead of using
      # trusted publishing (OIDC). Trusted publishing needs npm 11.5.1 or later.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install -g npm@latest && npm --version
      - uses: actions/download-artifact@v5
        with:
          name: npm-package
          path: pkg
      # A version already on npm (0.1.0 was published by hand, since npm only trusts a publisher
      # for a package that exists) is left alone, so the rest of the release can go on
      - name: Publish, unless this version is on npm already
        run: |
          version=$(node -p 'require("./pkg/package.json").version')
          if [ "$(npm view "logoxide@$version" version 2>/dev/null)" = "$version" ]; then
            echo "logoxide $version is on npm already"
          else
            npm publish ./pkg --access public --provenance
          fi
