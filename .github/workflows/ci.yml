name: CI

on:
  push:
  pull_request:

env:
  # release.yml's, which builds the packages with it
  BOLTFFI_VERSION: 0.31.0
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The topos tag the bindings build against comes from topos-bible's version in Cargo.toml
  # (scripts/topos-ref.sh), so it's written in one place

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The workspace, its logoxide dependency, and logoxide-ffi have one version
        run: scripts/check-versions.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The package manager alone reads no text: it builds without a parser
      - run: cargo check -p logoxide --no-default-features --all-targets

  # The oldest Rust the crates support (`rust-version` in Cargo.toml)
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read rust-version
        run: echo "MSRV=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: logoxide
      - name: The topos tag to build against
        run: echo "TOPOS_REF=$(logoxide/scripts/topos-ref.sh)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          repository: MasterTemple/topos-bible
          ref: ${{ env.TOPOS_REF }}
          path: topos
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # The bindings patch topos in their own Cargo.toml; sword-modules still comes from crates.io
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: logoxide/crates/logoxide-ffi
      - working-directory: logoxide/crates/logoxide-ffi
        run: |
          cargo fmt --check
          cargo test
          cargo clippy --all-targets -- -D warnings
      # README.md's examples and names checked against the bindings, generated but not built (the
      # pack scripts check them the same way against the packages, writing their READMEs)
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/boltffi*
          key: boltffi-${{ env.BOLTFFI_VERSION }}-ubuntu
      - name: Install BoltFFI
        run: command -v boltffi || cargo install boltffi_cli --version "$BOLTFFI_VERSION" --locked
      - name: The README's examples
        working-directory: logoxide/crates/logoxide-ffi
        run: |
          npm install
          boltffi generate typescript -o dist/api/ts
          boltffi generate python -o dist/api/python
          python3 scripts/readme.py check --wasm dist/api/ts --python dist/api/python/logoxide
